<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="המשמרת — משחק RPG קליני בגריאטריה ברמת אח/ות מומחה/ית: משמרת לילה, 7 מטופלים, 58 אירועים קליניים, סבבי מעבדה וביקורים גדולים.">
<title>המשמרת: מסע קליני בגריאטריה</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body class="on-title">
<div id="game-container">
  <div id="hud">
    <div class="hud-vitals">
      <div class="hud-name"><strong id="ui-name">—</strong><span>Lv.<span id="ui-lvl">1</span></span><span>משמרת <span id="ui-day">1</span></span><span id="ui-streak" class="flow-chip" title="רצף ימים">🔥 0</span><span id="ui-coins" class="coin-chip" title="מטבעות">🪙 0</span><span id="save-mark" aria-label="נשמר">◆</span></div>
      <div class="hud-bars"><span class="bar-tag">XP</span><div class="mini-bar"><div id="ui-xp-fill" class="mini-bar-fill"></div></div><span class="bar-tag">תגים</span><div id="ui-badges" class="badge-row"></div></div>
    </div>
    <button class="system-btn menu-btn" id="menu-btn" type="button" aria-label="תפריט">☰ <span>תפריט</span></button>
  </div>
  <div id="screen-area">
    <canvas id="gameCanvas" aria-label="מסך המשחק"></canvas>
    <div id="quest-box" style="display:none"><strong>🎯</strong><span id="quest-text"></span></div>
    <div id="loc-label"><b id="loc-name"></b><small id="loc-sub"></small></div>
    <div id="msg" role="dialog" aria-live="off"><div id="msg-name"></div><div id="msg-text" aria-hidden="true"></div><div id="msg-extra"></div><div id="msg-opts"></div><div id="msg-next">▼</div></div>
    <div id="msg-sr" class="sr" aria-live="polite"></div>
    <button id="skip-btn" class="system-btn" type="button">⏭ דלג</button>
    <div id="ach-toast" role="status"></div>
    <div id="title-modal" class="title-modal title-hidden">
      <div class="title-btns">
        <button class="btn-main" id="btn-continue" type="button" style="display:none">המשך משמרת<span class="cont-sub" id="cont-sub"></span></button>
        <button class="btn-main btn-secondary" id="btn-new" type="button">🩺 משמרת חדשה</button>
        <button class="system-btn" id="btn-settings" type="button" aria-label="הגדרות">⚙️</button>
      </div>
      <div class="title-tag">חיצים/WASD + Z · או הקשה על המסך · כלי למידה — אינו מחליף שיקול דעת קליני</div>
    </div>
  </div>
  <div id="scrim"></div>
  <div id="panel" class="panel" role="dialog" aria-modal="true"><div class="panel-header"><span id="panel-title"></span><button id="panel-x" class="x-btn" type="button" aria-label="סגירה">✕</button></div><div id="panel-body"></div></div>
  <input type="file" id="save-file" accept=".json,application/json" style="display:none">
</div>
<div id="boot-gate" tabindex="0" role="button" aria-label="הקש כדי להתחיל"><div class="gate-ring"></div><div class="gate-text">הקש כדי להתחיל</div></div>
<div id="mae-splash" class="mae-splash">
    <div class="mae-drop"></div><div class="mae-ripple"></div><div class="mae-ripple r2"></div>
    <div class="mae-stage">
      <div class="mae-bloom"></div>
      <svg viewBox="0 0 200 200" aria-label="Mae Studio">
        <defs>
          <linearGradient id="maeGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f9d67a"/><stop offset=".5" stop-color="#fff4d6"/><stop offset="1" stop-color="#d9973c"/></linearGradient>
          <filter id="maeGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <circle class="mae-ring2" cx="100" cy="100" r="92"/>
        <circle class="mae-ring" cx="100" cy="100" r="78"/>
        <circle class="mae-bristle" cx="100" cy="100" r="82.5"/>
        <circle class="mae-bristle b2" cx="100" cy="100" r="73.5"/>
        <circle class="mae-spl s1" cx="163" cy="54" r="2.6"/><circle class="mae-spl s2" cx="170" cy="63" r="1.6"/>
        <circle class="mae-spl s3" cx="158" cy="45" r="1.3"/><circle class="mae-spl s4" cx="175" cy="50" r="1"/>
        <text class="mae-l l1" x="73" y="116" text-anchor="middle">m</text>
        <text class="mae-l l2" x="106" y="116" text-anchor="middle">a</text>
        <text class="mae-l l3" x="130" y="116" text-anchor="middle">e</text>
        <path class="mae-under" d="M58 128 Q100 138 144 124"/>
        <circle class="mae-dot" cx="150" cy="118" r="3.4"/>
      </svg>
      <div class="mae-shine"></div>
    </div>
    <div class="mae-studio">Studio</div>
    <div class="mae-hint">הקש לדילוג</div>
  </div>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/world.js"></script>
<script src="js/mae.js"></script>
<script src="js/main.js"></script>
</body>
</html>
